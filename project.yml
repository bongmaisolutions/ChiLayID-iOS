name: BMSZaloiOS
options:
  bundleIdPrefix: vn.beos
  deploymentTarget:
    iOS: "17.0"
packages:
  BMSZalo:
    path: .
targets:
  BMSZaloiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOSApp
        excludes:
          - Info.plist
    info:
      path: iOSApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.beos.chilayid.ios
        PRODUCT_NAME: ChiLayID
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: BMSZalo
        product: BMSZaloApp
      - package: BMSZalo
        product: ZolaKit
