name: BMSZaloiOS
options:
  bundleIdPrefix: vn.beos
  deploymentTarget:
    iOS: "16.0"
packages:
  BMSZalo:
    path: .
targets:
  BMSZaloiOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iOSApp
        excludes:
          - Info.plist
    info:
      path: iOSApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.beos.bmszalo.ios
        PRODUCT_NAME: BMSZalo
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - package: BMSZalo
        product: BMSZaloApp
      - package: BMSZalo
        product: ZolaKit
